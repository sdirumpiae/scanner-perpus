<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner QR Perpustakaan Sekolah</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- HTML5 QR Code Scanner -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        .scanner-laser {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #38bdf8, #818cf8, transparent);
            box-shadow: 0 0 15px #818cf8;
            animation: scanning 2s infinite ease-in-out;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes scanning {
            0% { top: 10%; opacity: 0.2; }
            50% { top: 90%; opacity: 1; }
            100% { top: 10%; opacity: 0.2; }
        }

        #qr-video-reader video {
            object-fit: cover !important;
            border-radius: 1rem;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between p-4 sm:p-6 min-h-screen">

    <!-- Header -->
    <header class="w-full max-w-md text-center pt-2 pb-4">
        <div class="inline-flex items-center justify-center space-x-2 bg-indigo-500/20 border border-indigo-400/30 px-4 py-1.5 rounded-full text-indigo-300 text-xs font-semibold mb-3">
            <i class="fas fa-shield-alt text-emerald-400"></i>
            <span>Domain Eksternal Aman (Bebas Sandbox Iframe)</span>
        </div>
        <h1 class="text-2xl font-black text-white tracking-tight flex items-center justify-center gap-2">
            <i class="fas fa-qrcode text-indigo-400"></i>
            <span>Scanner Perpustakaan</span>
        </h1>
        <p class="text-xs text-slate-400 mt-1" id="scanTargetLabel">Memindai untuk: Kunjungan Siswa</p>
    </header>

    <!-- Scanner Viewport Area -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center">
        <div class="relative w-full aspect-square max-w-[340px] bg-slate-900 border-2 border-indigo-500/50 rounded-2xl overflow-hidden shadow-2xl shadow-indigo-500/20 flex items-center justify-center">
            
            <!-- Laser Animation -->
            <div id="laserBar" class="scanner-laser"></div>

            <!-- Frame Target Guides -->
            <div class="absolute inset-4 border border-white/20 rounded-xl pointer-events-none z-10">
                <div class="absolute top-0 left-0 w-6 h-6 border-t-4 border-l-4 border-indigo-400 rounded-tl-lg"></div>
                <div class="absolute top-0 right-0 w-6 h-6 border-t-4 border-r-4 border-indigo-400 rounded-tr-lg"></div>
                <div class="absolute bottom-0 left-0 w-6 h-6 border-b-4 border-l-4 border-indigo-400 rounded-bl-lg"></div>
                <div class="absolute bottom-0 right-0 w-6 h-6 border-b-4 border-r-4 border-indigo-400 rounded-br-lg"></div>
            </div>

            <!-- Container video html5-qrcode -->
            <div id="qr-video-reader" class="w-full h-full"></div>
            
            <!-- Loading Indicator -->
            <div id="loadingOverlay" class="absolute inset-0 bg-slate-950/80 flex flex-col items-center justify-center p-4 text-center z-20">
                <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-3"></div>
                <p class="text-sm font-semibold text-slate-200" id="loadingText">Menghubungkan ke kamera...</p>
                <p class="text-xs text-slate-400 mt-1">Pastikan izin kamera diizinkan</p>
            </div>
        </div>

        <!-- Status Badge -->
        <div class="mt-4 w-full max-w-[340px] text-center">
            <div id="statusBadge" class="py-2 px-3 rounded-xl bg-slate-800/80 border border-slate-700 text-xs font-medium text-slate-300 flex items-center justify-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="statusDot"></span>
                <span id="statusText">Arahkan kamera ke Kartu QR Siswa</span>
            </div>
        </div>

        <!-- Controls: Switch Camera & Snapshot HP -->
        <div class="mt-3 w-full max-w-[340px] flex items-center justify-between gap-2">
            <button onclick="switchCamera()" id="btnSwitchCamera" class="flex-1 bg-slate-800 hover:bg-slate-700 active:bg-slate-900 border border-slate-700 text-slate-200 text-xs font-bold py-2.5 px-3 rounded-xl transition flex items-center justify-center space-x-2">
                <i class="fas fa-sync-alt text-indigo-400"></i>
                <span id="switchCameraText">Ganti Kamera</span>
            </button>
            
            <label class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs font-bold py-2.5 px-4 rounded-xl cursor-pointer transition flex items-center justify-center space-x-2 shadow-lg shadow-indigo-600/30">
                <i class="fas fa-camera"></i>
                <span>Foto (HP)</span>
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleImageFile(event)">
            </label>
        </div>
    </main>

    <!-- Footer Action -->
    <footer class="w-full max-w-md pt-4 pb-2 text-center">
        <button onclick="closeOrReturn()" class="w-full bg-slate-800/80 hover:bg-rose-900/40 border border-slate-700 hover:border-rose-500/50 text-slate-300 hover:text-rose-300 font-bold py-3 rounded-xl text-xs transition flex items-center justify-center space-x-2">
            <i class="fas fa-arrow-left"></i>
            <span id="btnExitText">Tutup / Kembali ke Aplikasi Utama</span>
        </button>
        <p class="text-[10px] text-slate-500 mt-2">Sistem Perpustakaan Sekolah &copy; 2026</p>
    </footer>

    <!-- LOGIKA JAVASCRIPT SCANNER -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const scanTarget = urlParams.get('target') || 'visitor';
        const returnUrl = urlParams.get('returnUrl') || '';
        const scriptUrl = urlParams.get('scriptUrl') || '';

        // Update target label
        const targetLabel = document.getElementById('scanTargetLabel');
        if (targetLabel) {
            targetLabel.innerText = scanTarget === 'visitor' ? 
                'Memindai untuk: Catat Kunjungan Baru' : 
                'Memindai untuk: Catat Peminjaman Buku';
        }

        let html5QrCode = null;
        let availableCameras = [];
        let currentCameraIndex = 0;
        let isProcessing = false;

        // Suara BEEP saat QR berhasil dibaca
        function playBeep() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        }

        function setStatus(text, type = 'info') {
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');
            if (statusText) statusText.innerText = text;
            if (statusDot) {
                if (type === 'success') {
                    statusDot.className = 'w-2 h-2 rounded-full bg-emerald-400';
                } else if (type === 'error') {
                    statusDot.className = 'w-2 h-2 rounded-full bg-rose-400';
                } else {
                    statusDot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-pulse';
                }
            }
        }

        async function initScanner() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const preferredModes = isMobile ? ["environment", "user"] : ["user", "environment"];
            
            html5QrCode = new Html5Qrcode("qr-video-reader");

            const scanConfig = {
                fps: 15,
                qrbox: (w, h) => {
                    const minEdge = Math.min(w || 250, h || 250);
                    const size = Math.floor(minEdge * 0.72);
                    return { width: Math.max(size, 160), height: Math.max(size, 160) };
                }
            };

            let started = false;

            // Percobaan 1: Menggunakan facingMode
            for (const mode of preferredModes) {
                try {
                    await html5QrCode.start({ facingMode: mode }, scanConfig, onScanSuccess, () => {});
                    started = true;
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    setStatus('Kamera Aktif. Posisikan QR di dalam bingkai.', 'success');
                    break;
                } catch (e) {
                    await new Promise(r => setTimeout(r, 200));
                }
            }

            // Percobaan 2: Menggunakan ID Kamera Fisik
            if (!started) {
                try {
                    availableCameras = await Html5Qrcode.getCameras();
                    if (availableCameras && availableCameras.length > 0) {
                        currentCameraIndex = isMobile && availableCameras.length > 1 ? availableCameras.length - 1 : 0;
                        const cam = availableCameras[currentCameraIndex];
                        await html5QrCode.start(cam.id, scanConfig, onScanSuccess, () => {});
                        started = true;
                        document.getElementById('loadingOverlay').classList.add('hidden');
                        setStatus(`Kamera Aktif: ${cam.label || 'Kamera Utama'}`, 'success');
                    }
                } catch (err) {}
            }

            if (!started) {
                document.getElementById('loadingOverlay').classList.add('hidden');
                setStatus('Kamera tidak dapat diakses.', 'error');
                Swal.fire({
                    icon: 'warning',
                    title: 'Izin Kamera Diperlukan',
                    text: 'Pastikan Anda mengizinkan akses kamera browser. Anda juga dapat menggunakan tombol "Foto (HP)" di bawah.',
                    confirmButtonColor: '#4f46e5'
                });
            } else {
                try {
                    if (availableCameras.length === 0) {
                        availableCameras = await Html5Qrcode.getCameras();
                    }
                } catch(e) {}
            }
        }

        async function switchCamera() {
            if (isProcessing) return;
            try {
                if (!availableCameras || availableCameras.length <= 1) {
                    availableCameras = await Html5Qrcode.getCameras();
                }
            } catch(e) {}

            if (!availableCameras || availableCameras.length <= 1) {
                return Swal.fire({
                    icon: 'info',
                    title: 'Info Kamera',
                    text: 'Hanya terdeteksi 1 kamera pada perangkat ini.',
                    confirmButtonColor: '#4f46e5'
                });
            }

            try {
                setStatus('Beralih kamera...', 'info');
                await html5QrCode.stop();
                html5QrCode.clear();

                currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
                const nextCam = availableCameras[currentCameraIndex];

                html5QrCode = new Html5Qrcode("qr-video-reader");
                const scanConfig = { fps: 15, qrbox: { width: 220, height: 220 } };

                await html5QrCode.start(nextCam.id, scanConfig, onScanSuccess, () => {});
                setStatus(`Kamera: ${nextCam.label || `Kamera ${currentCameraIndex + 1}`}`, 'success');
            } catch(e) {
                console.error("Gagal beralih kamera:", e);
            }
        }

        async function onScanSuccess(decodedText) {
            if (isProcessing) return;
            isProcessing = true;

            playBeep();
            const cleanCode = String(decodedText || '').trim();
            setStatus(`QR Berhasil Terbaca: ${cleanCode}`, 'success');

            // 1. Kirim pesan ke Aplikasi Utama (window.opener)
            let sentToOpener = false;
            if (window.opener && !window.opener.closed) {
                try {
                    window.opener.postMessage({
                        type: 'PERPUS_QR_SCANNED',
                        code: cleanCode,
                        target: scanTarget
                    }, '*');
                    sentToOpener = true;
                } catch (e) {}
            }

            // 2. Kirim data langsung ke Google Apps Script jika scriptUrl tersedia
            if (scriptUrl) {
                try {
                    fetch(scriptUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'scanQR',
                            target: scanTarget,
                            code: cleanCode,
                            timestamp: new Date().toISOString()
                        })
                    }).catch(err => {});
                } catch(e) {}
            }

            // Dialog sukses
            Swal.fire({
                icon: 'success',
                title: 'QR Berhasil Dipindai!',
                html: `
                    <div class="text-left bg-slate-100 p-3 rounded-xl border border-slate-200 text-xs font-mono text-slate-800 space-y-1 mb-2">
                        <div><b>Kode QR:</b> ${cleanCode}</div>
                        <div><b>Tujuan:</b> ${scanTarget === 'visitor' ? 'Kunjungan Siswa' : 'Peminjaman Buku'}</div>
                    </div>
                    <p class="text-sm text-slate-600">
                        ${sentToOpener ? '✅ Data telah otomatis diteruskan ke formulir aplikasi perpustakaan!' : 'Data berhasil diproses.'}
                    </p>
                `,
                showCancelButton: true,
                confirmButtonColor: '#4f46e5',
                cancelButtonColor: '#64748b',
                confirmButtonText: sentToOpener ? 'Tutup Scanner' : 'Kembali ke Aplikasi',
                cancelButtonText: 'Scan Lagi'
            }).then((result) => {
                if (result.isConfirmed) {
                    closeOrReturn(cleanCode);
                } else {
                    isProcessing = false;
                    setStatus('Arahkan kamera ke Kartu QR Siswa', 'info');
                }
            });
        }

        async function handleImageFile(e) {
            const file = e.target.files[0];
            if (!file) return;

            setStatus('Membaca kode QR dari foto...', 'info');
            try {
                const text = await html5QrCode.scanFile(file, true);
                onScanSuccess(text);
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: 'QR Tidak Terdeteksi',
                    text: 'Pastikan gambar foto QR jelas, tegak lurus, dan tidak buram.',
                    confirmButtonColor: '#4f46e5'
                });
                setStatus('Gagal membaca QR dari foto', 'error');
            } finally {
                e.target.value = '';
            }
        }

        function closeOrReturn(scannedCode = '') {
            if (window.opener && !window.opener.closed) {
                window.close();
                return;
            }
            if (returnUrl) {
                const targetUrl = new URL(returnUrl);
                if (scannedCode) {
                    targetUrl.searchParams.set('scannedCode', scannedCode);
                    targetUrl.searchParams.set('target', scanTarget);
                }
                window.location.href = targetUrl.toString();
                return;
            }
            window.history.back();
        }

        window.addEventListener('DOMContentLoaded', () => {
            initScanner();
        });
    </script>
</body>
</html>
